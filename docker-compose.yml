# Octopus platform (API + worker) on a Linux Docker host.
#
# Linux-first: both services use host networking so the worker's
# `docker run -p 127.0.0.1:<port>` app containers are reachable by the API's
# YARP routes exactly like host-run `dotnet run` processes.
# `network_mode: host` does NOT work on Docker Desktop for Windows/Mac
# (host = the Desktop VM) — there, run Api + Worker via `dotnet run` instead.
#
# Usage:
#   docker compose up --build -d
#   curl http://localhost:5000/health
#   docker compose logs -f
#   docker compose down        # data persists in the octopus-data volume

name: octopus

services:
  # Opt-in control-plane database. SQLite stays the default; to use Postgres,
  # uncomment the ConnectionStrings__Octopus lines below (same value in both
  # services) and set POSTGRES_PASSWORD in a local .env (never commit it).
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-octopus-dev-only}
      POSTGRES_DB: octopus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octopus -d octopus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Octopus.Api/Dockerfile
    network_mode: host
    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Octopus: Data Source=/data/octopus.db
      # ConnectionStrings__Octopus: Host=localhost;Port=5432;Username=octopus;Password=${POSTGRES_PASSWORD:-octopus-dev-only};Database=octopus
      Octopus__Workspace: /data/workspace
    volumes:
      - octopus-data:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/Octopus.Worker/Dockerfile
    network_mode: host
    environment:
      ConnectionStrings__Octopus: Data Source=/data/octopus.db
      # ConnectionStrings__Octopus: Host=localhost;Port=5432;Username=octopus;Password=${POSTGRES_PASSWORD:-octopus-dev-only};Database=octopus
      Octopus__Workspace: /data/workspace
    volumes:
      - octopus-data:/data
      # Worker shells out to the host's docker CLI to build/run app containers.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - api

volumes:
  octopus-data:
  pgdata:
